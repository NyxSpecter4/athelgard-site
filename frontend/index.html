<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athelgard — AI Coding Agent v3.0</title>
<script src="/modules/brain.js"></script>
<script src="/modules/config.js"></script>
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--cyan:#12e0ff;--green:#3dff9a;--text:#e0e0e0;--border:#1a1a2e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui;height:100vh;display:flex;flex-direction:column}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:24px;font-weight:800;color:var(--cyan)}
.status{display:flex;gap:10px;margin-left:auto;font-size:11px}
.status span{padding:4px 10px;border-radius:20px;background:rgba(61,255,154,0.15);color:var(--green);border:1px solid var(--green)}
.status .bad{background:rgba(255,61,61,0.15);color:#ff3d3d;border-color:#ff3d3d}
.mode-buttons{display:flex;gap:8px}
.mode-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-size:12px}
.mode-btn:hover{background:var(--bg3)}
.mode-btn.active{background:var(--cyan);color:#000;border-color:var(--cyan)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;max-width:900px;width:100%;margin:0 auto}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--cyan);color:#000}
.msg.ai{align-self:flex-start;background:var(--bg3);border:1px solid var(--border)}
.msg .name{font-size:11px;font-weight:700;margin-bottom:4px;opacity:0.7}
.msg.ai .name{color:var(--cyan)}
.input-area{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);background:var(--bg2)}
input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--cyan)}
input:disabled{opacity:0.5;cursor:not-allowed}
button{background:var(--cyan);border:none;border-radius:12px;padding:12px 20px;color:#000;font-weight:700;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.loading{color:var(--cyan);font-style:italic}
.settings-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
.settings-btn:hover{background:var(--bg3)}
</style>
</head>
<body>
<header class="header">
  <div class="logo">🦉 Athelgard</div>
  <div class="mode-buttons">
    <button class="mode-btn active" onclick="setMode('code')">Code</button>
    <button class="mode-btn" onclick="setMode('jeopardy')">Jeopardy</button>
    <button class="mode-btn" onclick="setMode('wheel')">Wheel</button>
  </div>
  <div class="status">
    <span>Brain: Active</span>
    <span>GitHub: <span id="githubStatus">Checking...</span></span>
    <span>AI: <span id="aiStatus">Ready</span></span>
  </div>
  <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
</header>
<main class="main">
  <div class="messages" id="messages"></div>
</main>
<div class="input-area">
  <input type="text" id="userInput" placeholder="Ask Athelgard anything..." onkeydown="if(event.key==='Enter') sendMessage()" disabled>
  <button onclick="sendMessage()" disabled>Send</button>
</div>

<!-- Settings Modal -->
<div id="settingsModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center">
  <div style="background:var(--bg2);padding:30px;border-radius:20px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto">
    <h2 style="color:var(--cyan);margin-bottom:20px">Settings</h2>
    <div style="margin-bottom:20px">
      <h3 style="color:var(--text);margin-bottom:10px">GitHub Connection</h3>
      <button onclick="connectGitHub()" style="background:var(--cyan);border:none;border-radius:8px;padding:10px 20px;color:#000;cursor:pointer">Connect GitHub</button>
      <p style="font-size:12px;color:var(--text);opacity:0.7;margin-top:10px">Required for repository access</p>
    </div>
    <div style="margin-bottom:20px">
      <h3 style="color:var(--text);margin-bottom:10px">AI Providers</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div>
          <label style="display:block;margin-bottom:4px;color:var(--text);font-size:12px">DeepSeek API Key</label>
          <input type="password" id="deepseekKey" placeholder="sk-..." style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text)">
        </div>
        <div>
          <label style="display:block;margin-bottom:4px;color:var(--text);font-size:12px">Kimi API Key</label>
          <input type="password" id="kimiKey" placeholder="sk-..." style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text)">
        </div>
      </div>
      <button onclick="saveAPIKeys()" style="background:var(--cyan);border:none;border-radius:8px;padding:10px 20px;color:#000;cursor:pointer;margin-top:15px">Save Keys</button>
    </div>
    <button onclick="closeSettings()" style="background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:20px">Close</button>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const githubStatus = document.getElementById('githubStatus');
const aiStatus = document.getElementById('aiStatus');
const settingsModal = document.getElementById('settingsModal');
let currentMode = 'code';
let isReady = false;

function addMessage(sender, text, isUser=false) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + (isUser ? 'user' : 'ai');
  if (!isUser) {
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = sender;
    msg.appendChild(name);
  }
  const textNode = document.createElement('div');
  textNode.innerHTML = text;
  msg.appendChild(textNode);
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.mode-btn:nth-child(${['code','jeopardy','wheel'].indexOf(mode)+1})`).classList.add('active');
  addMessage('Athelgard', `Mode switched to: ${mode.toUpperCase()}`);
}

function openSettings() {
  settingsModal.style.display = 'flex';
}

function closeSettings() {
  settingsModal.style.display = 'none';
}

function connectGitHub() {
  window.location.href = '/api/github?action=authorize';
}

function saveAPIKeys() {
  const deepseek = document.getElementById('deepseekKey').value;
  const kimi = document.getElementById('kimiKey').value;
  
  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deepseek, kimi })
  })
  .then(r => r.json())
  .then(data => {
    closeSettings();
    addMessage('Athelgard', '✅ API keys saved!');
    aiStatus.textContent = 'Configured';
  })
  .catch(() => {
    addMessage('Athelgard', '❌ Failed to save API keys');
  });
}

function checkGitHubStatus() {
  fetch('/api/github?action=status')
    .then(r => r.json())
    .then(data => {
      githubStatus.textContent = data.connected ? 'Connected ✓' : 'Not Connected';
      githubStatus.parentElement.className = data.connected ? 'status' : 'status bad';
      if (data.connected) {
        isReady = true;
        userInput.disabled = false;
        document.querySelector('button:last-of-type').disabled = false;
        if (!messages.querySelector('.welcome')) {
          addMessage('Athelgard', '✅ GitHub connected! Repository access enabled.');
          addMessage('Athelgard', 'Try: "List my repositories" or "Write a Python function"');
        }
      }
    })
    .catch(() => {
      githubStatus.textContent = 'Error';
      githubStatus.parentElement.className = 'status bad';
    });
}

function sendMessage() {
  if (!isReady) {
    addMessage('Athelgard', '⚠️ Please connect GitHub first to enable coding features.');
    return;
  }
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  addMessage('You', text, true);
  addMessage('Athelgard', '<span class="loading">Thinking...</span>');
  
  const endpoint = currentMode === 'code' ? '/api/brain' : 
                  currentMode === 'jeopardy' ? '/api/jeopardy' : 
                  '/api/wheel';
  
  fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: text, mode: currentMode })
  })
  .then(r => r.json())
  .then(data => {
    // Remove loading message
    const loadingMsg = Array.from(messages.children).find(m => m.querySelector('.loading'));
    if (loadingMsg) messages.removeChild(loadingMsg);
    
    const response = data.response || data.mentor || data.message || data.answer || 'I heard you!';
    addMessage('Athelgard', response);
  })
  .catch(err => {
    const loadingMsg = Array.from(messages.children).find(m => m.querySelector('.loading'));
    if (loadingMsg) messages.removeChild(loadingMsg);
    addMessage('Athelgard', '❌ Error: ' + (err.message || 'Please try again'));
  });
}

// Initial messages
addMessage('Athelgard', '🦉 <strong>Athelgard Agent v3.0 - MERGE MASTER COMPLETE</strong>');
addMessage('Athelgard', 'All team contributions synthesized: MELI, Mako, Captain, Cascade, Cindy, CodeRabbit, Qodo, Copilot.');
addMessage('Athelgard', '✅ <strong>Coding CLI</strong> | 🔌 <strong>GitHub Integration</strong> | 🎮 <strong>Games</strong>');
addMessage('Athelgard', '<strong>Connect GitHub to unlock full features.</strong>');

// Check status
checkGitHubStatus();
setInterval(checkGitHubStatus, 30000);
</script>
</body>
</html>
