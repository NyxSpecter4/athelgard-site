<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="background-color" content="#0a0e1a">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Athelgard">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.svg">
  
  <!-- Android/Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.svg">
  
  <!-- Windows -->
  <meta name="msapplication-TileColor" content="#0a0e1a">
  <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">
  
  <title>Athelgard — AI Bounty Hunter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0d1117;
      --bg-light: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --success: #3fb950;
      --warning: #d29922;
    }
    
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh; /* mobile viewport fix */
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    /* Mobile responsive */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr !important;
        grid-template-rows: auto 1fr auto;
      }
      .sidebar { display: none; }
      .chat-panel { 
        position: fixed; 
        bottom: 0; 
        left: 0; 
        right: 0; 
        height: 60vh; 
        z-index: 50;
        transform: translateY(100%);
        transition: transform 0.3s ease;
      }
      .chat-panel.open { transform: translateY(0); }
    }
    
    /* PWA Install button */
    #pwa-install-btn {
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Top Bar */
    .top-bar {
      height: 48px;
      background: var(--bg-light);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    
    .logo { font-size: 1.25rem; font-weight: 600; color: var(--accent); }
    .user-info { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .user-info img { width: 28px; height: 28px; border-radius: 50%; }
    .btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: var(--bg); border: none; }
    .btn-primary:hover { background: var(--accent-hover); }
    
    /* Layout */
    .container {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      grid-template-rows: 1fr 200px;
      height: calc(100vh - 48px);
    }
    
    /* Sidebar */
    .sidebar {
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 8px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .file-item {
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .file-item:hover { background: rgba(255,255,255,0.05); }
    .file-item.active { background: var(--accent); color: var(--bg); }
    .file-item.dir { font-weight: 500; }
    .file-item .icon { font-size: 0.875rem; }
    
    /* Editor */
    .editor-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    
    .tabs {
      display: flex;
      background: var(--bg-light);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      border-right: 1px solid var(--border);
      font-size: 0.875rem;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab.active { background: var(--bg); border-bottom: 2px solid var(--accent); }
    .tab:hover:not(.active) { background: rgba(255,255,255,0.05); }
    .tab .close { opacity: 0; }
    .tab:hover .close { opacity: 1; }
    
    #editor-container {
      flex: 1;
      overflow: hidden;
    }
    
    /* Terminal */
    .terminal-panel {
      grid-column: 1 / -1;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    
    .terminal-output {
      flex: 1;
      padding: 8px 12px;
      overflow-y: auto;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    
    .terminal-input-line {
      display: flex;
      align-items: center;
      padding: 4px 12px;
      border-top: 1px solid var(--border);
    }
    
    .terminal-prompt { color: var(--success); margin-right: 8px; }
    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
    }
    
    /* Chat Panel */
    .chat-panel {
      background: var(--bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .message {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      line-height: 1.5;
      max-width: 100%;
    }
    
    .message.user {
      background: var(--accent);
      color: var(--bg);
      align-self: flex-end;
    }
    
    .message.ai {
      background: var(--bg-light);
      border: 1px solid var(--border);
    }
    
    .message .sender {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    
    .chat-input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      resize: none;
      outline: none;
    }
    
    .chat-input:focus { border-color: var(--accent); }
    
    /* Login Overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    
    .login-overlay.hidden { display: none; }
    
    .login-box {
      text-align: center;
      padding: 2rem;
    }
    
    .login-box h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    .login-box p { color: var(--text-muted); margin-bottom: 2rem; }
    
    /* Loading */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <div style="font-size: 4rem;">🦉</div>
      <h1>Athelgard IDE</h1>
      <p>Your AI-powered coding environment</p>
      <button class="btn btn-primary" onclick="loginWithGitHub()">
        <span>🔗 Login with GitHub</span>
      </button>
      <p style="margin-top: 1rem; font-size: 0.75rem; color: var(--text-muted);">
        Or run locally: <code>athelgard connect &lt;code&gt;</code>
      </p>
    </div>
  </div>

  <!-- Main IDE -->
  <div class="top-bar">
    <span class="logo">🦉 Athelgard</span>
    <button class="btn" id="builderToggle" onclick="toggleBuilderMode()">🛠️ Builder Mode: OFF</button>
    <button class="btn" onclick="loadRepos()">📁 Repos</button>
    <button class="btn" onclick="runCode()">▶ Run</button>
    <div class="user-info" id="userInfo" style="display:none;">
      <img id="userAvatar" src="" alt="">
      <span id="userName"></span>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <!-- File Explorer -->
    <div class="sidebar">
      <div class="panel-header">
        <span>Explorer</span>
        <button class="btn" onclick="loadRepos()" style="padding:2px 6px;">↻</button>
      </div>
      <div class="file-tree" id="fileTree">
        <div class="file-item" onclick="showLoginPrompt()">
          <span class="icon">🔒</span> Login to browse repos
        </div>
      </div>
    </div>

    <!-- Editor -->
    <div class="editor-panel">
      <div class="tabs" id="tabs">
        <div class="tab active" data-file="welcome">
          <span>👋 Welcome</span>
        </div>
      </div>
      <div id="editor-container"></div>
    </div>

    <!-- AI Chat -->
    <div class="chat-panel">
      <div class="panel-header">
        <span>🤖 Athelgard AI</span>
        <button class="btn" onclick="clearChat()" style="padding:2px 6px;">Clear</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="message ai">
          <div class="sender">Athelgard</div>
          Hello! I'm your AI coding assistant. Login with GitHub to start coding together.
        </div>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" rows="2" placeholder="Ask me anything..." onkeydown="handleChatKey(event)"></textarea>
      </div>
    </div>

    <!-- Terminal -->
    <div class="terminal-panel">
      <div class="panel-header">
        <span>Terminal</span>
        <button class="btn" onclick="clearTerminal()" style="padding:2px 6px;">Clear</button>
      </div>
      <div class="terminal-output" id="terminalOutput"></div>
      <div class="terminal-input-line">
        <span class="terminal-prompt">$</span>
        <input type="text" class="terminal-input" id="terminalInput" placeholder="Type command..." onkeydown="handleTerminalKey(event)">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="/modules/brain.js"></script>
  <script>
    // State
    let editor;
    let currentFile = null;
    let openFiles = new Map();
    let githubToken = null;
    let currentRepo = null;

    // MELI Brain Integration
    function checkEthicalContext(text) {
      if (typeof window.AthelgardBrain === 'undefined') return null;
      const lower = text.toLowerCase();
      const bountyKeywords = ['exploit', 'vulnerability', 'bug bounty', 'pentest', 'scope', 'cve', 'owasp'];
      const isBounty = bountyKeywords.some(k => lower.includes(k));
      if (!isBounty) return null;
      // Run through MELI's brain
      const result = window.AthelgardBrain.process(text, { 
        type: 'mentor', 
        simulated: lower.includes('simulated') || lower.includes('training'),
        scope: { authorized: lower.includes('authorized') || lower.includes('in-scope') },
        gameMode: lower.includes('drone') ? 'drone' : lower.includes('hunt') ? 'hunt' : null
      });
      return result;
    }

    // Initialize Monaco Editor
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: `// Welcome to Athelgard IDE
// Login with GitHub to start coding

function hello() {
  console.log("Hello from Athelgard!");
}

hello();`,
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true,
        minimap: { enabled: false },
        fontSize: 14,
        fontFamily: 'SF Mono, Monaco, Inconsolata, monospace',
      });
    });

    // Auth Check
    async function checkAuth() {
      try {
        const res = await fetch('/api/health?path=github&action=status', { credentials: 'same-origin' });
        const data = await res.json();
        
        if (data.connected) {
          document.getElementById('loginOverlay').classList.add('hidden');
          document.getElementById('userInfo').style.display = 'flex';
          document.getElementById('userAvatar').src = data.user.avatar_url;
          document.getElementById('userName').textContent = data.user.login;
          loadRepos();
          addChatMessage('ai', `Welcome back, ${data.user.login}! I'm ready to help you code.`);
        } else {
          // Show login prompt in explorer
          document.getElementById('fileTree').innerHTML = `
            <div class="file-item" onclick="showLoginPrompt()">
              <span class="icon">🔒</span> Login to browse repos
            </div>`;
        }
      } catch (e) {
        console.error('Auth check failed:', e);
        addChatMessage('ai', 'Connection error. Please refresh the page.');
      }
    }

    // Login
    function loginWithGitHub() {
      window.location.href = '/api/health?path=github&action=login';
    }

    function logout() {
      fetch('/api/health?path=github&action=logout', { method: 'POST' })
        .then(() => location.reload());
    }

    let builderMode = false;
    function toggleBuilderMode() {
      builderMode = !builderMode;
      const btn = document.getElementById('builderToggle');
      btn.textContent = builderMode ? '🔧 Builder Mode: ON' : '🛠️ Builder Mode: OFF';
      btn.style.borderColor = builderMode ? 'var(--success)' : 'var(--border)';
      addChatMessage('ai', builderMode ? '🔧 **Builder Mode activated.** I will use technical precision, repo-aware analysis, and structured output (Situation → Systems → Plan → Patch → Verify → Risks).' : '🛠️ **Builder Mode off.** Standard mentoring mode.');
    }

    function showLoginPrompt() {
      addChatMessage('ai', 'Please login with GitHub to browse your repositories.');
    }

    // Load Repos
    async function loadRepos() {
      try {
        const res = await fetch('/api/health?path=github&action=repos', { credentials: 'same-origin' });
        
        if (res.status === 401) {
          showLoginPrompt();
          return;
        }
        
        const data = await res.json();
        
        if (data.error) {
          addTerminalOutput('Error: ' + data.error);
          return;
        }
        
        const tree = document.getElementById('fileTree');
        tree.innerHTML = '<div class="panel-header"><span>Your Repositories</span><button class="btn" onclick="loadRepos()" style="padding:2px 6px;">↻</button></div>';
        
        if (!data.repos || data.repos.length === 0) {
          tree.innerHTML += '<div class="file-item">No repositories found</div>';
          return;
        }
        
        data.repos.forEach(repo => {
          const item = document.createElement('div');
          item.className = 'file-item dir';
          item.innerHTML = `<span class="icon">📁</span> ${repo.full_name}`;
          item.onclick = () => loadRepoTree(repo.full_name);
          tree.appendChild(item);
        });
      } catch (e) {
        addTerminalOutput('Error loading repos: ' + e.message);
      }
    }

    // Load Repo Tree
    async function loadRepoTree(repo) {
      currentRepo = repo;
      try {
        const res = await fetch(`/api/health?path=github&action=contents&owner=${repo.split('/')[0]}&repo=${repo.split('/')[1]}&path=`);
        const data = await res.json();
        
        const tree = document.getElementById('fileTree');
        tree.innerHTML = `<div class="panel-header"><span>${repo}</span><button class="btn" onclick="loadRepos()" style="padding:2px 6px;">← Back</button></div>`;
        
        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'file-item' + (item.type === 'dir' ? ' dir' : '');
          div.innerHTML = `<span class="icon">${item.type === 'dir' ? '📁' : '📄'}</span> ${item.name}`;
          div.onclick = () => {
            if (item.type === 'file') loadFile(repo, item.path);
            else loadRepoContents(repo, item.path);
          };
          tree.appendChild(div);
        });
      } catch (e) {
        addTerminalOutput('Error: ' + e.message);
      }
    }

    // Load File
    async function loadFile(repo, path) {
      try {
        const res = await fetch(`/api/health?path=github&action=contents&owner=${repo.split('/')[0]}&repo=${repo.split('/')[1]}&path=${path}`);
        const data = await res.json();
        
        const content = atob(data.content.replace(/\n/g, ''));
        const lang = getLanguage(path);
        
        // Update editor
        if (editor) {
          editor.setValue(content);
          monaco.editor.setModelLanguage(editor.getModel(), lang);
        }
        
        currentFile = { repo, path, sha: data.sha };
        openFiles.set(path, content);
        updateTabs();
        
        addTerminalOutput(`Opened ${repo}/${path}`);
      } catch (e) {
        addTerminalOutput('Error loading file: ' + e.message);
      }
    }

    function getLanguage(filename) {
      const ext = filename.split('.').pop();
      const map = {
        js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
        py: 'python', rb: 'ruby', go: 'go', rs: 'rust',
        java: 'java', cpp: 'cpp', c: 'c', h: 'c',
        html: 'html', css: 'css', scss: 'scss', json: 'json',
        md: 'markdown', yaml: 'yaml', yml: 'yaml', sql: 'sql',
        sh: 'shell', bash: 'shell', zsh: 'shell'
      };
      return map[ext] || 'plaintext';
    }

    function updateTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      openFiles.forEach((content, path) => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (path === currentFile?.path ? ' active' : '');
        tab.innerHTML = `<span>${path.split('/').pop()}</span><span class="close" onclick="closeFile('${path}')">×</span>`;
        tab.onclick = (e) => { if (!e.target.classList.contains('close')) switchToFile(path); };
        tabs.appendChild(tab);
      });
    }

    function switchToFile(path) {
      currentFile = { ...currentFile, path };
      if (editor) editor.setValue(openFiles.get(path) || '');
      updateTabs();
    }

    function closeFile(path) {
      openFiles.delete(path);
      if (currentFile?.path === path) {
        const next = openFiles.keys().next().value;
        if (next) switchToFile(next);
        else {
          currentFile = null;
          if (editor) editor.setValue('// Select a file to edit');
        }
      }
      updateTabs();
    }

    // Terminal
    function addTerminalOutput(text) {
      const output = document.getElementById('terminalOutput');
      const line = document.createElement('div');
      line.textContent = text;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function clearTerminal() {
      document.getElementById('terminalOutput').innerHTML = '';
    }

    function handleTerminalKey(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('terminalInput');
        const cmd = input.value.trim();
        if (!cmd) return;
        
        addTerminalOutput('$ ' + cmd);
        
        // Simple command handling
        if (cmd === 'help') {
          addTerminalOutput('Available: help, clear, repos, ls, cat <file>');
        } else if (cmd === 'clear') {
          clearTerminal();
        } else if (cmd === 'repos') {
          loadRepos();
        } else {
          addTerminalOutput('Command not implemented. Use the UI or ask AI.');
        }
        
        input.value = '';
      }
    }

    // Chat
    function addChatMessage(role, text) {
      const messages = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.innerHTML = `<div class="sender">${role === 'ai' ? 'Athelgard' : 'You'}</div>${text}`;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function clearChat() {
      document.getElementById('chatMessages').innerHTML = '';
    }

    async function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        
        addChatMessage('user', text);
        input.value = '';
        
        // MELI Brain: Check ethical context
        const ethical = checkEthicalContext(text);
        if (ethical && ethical.requiresScope) {
          addChatMessage('ai', '🛡️ **Ethical Guardrail**: ' + ethical.response);
          return;
        }
        if (ethical && ethical.rail) {
          addChatMessage('ai', '🎯 **Mission Mode** (' + ethical.rail.join(' → ') + '): ' + ethical.response);
        }
        
        // Show loading
        const loadingId = 'loading-' + Date.now();
        const messages = document.getElementById('chatMessages');
        const loading = document.createElement('div');
        loading.id = loadingId;
        loading.className = 'message ai';
        loading.innerHTML = '<div class="loading"></div>';
        messages.appendChild(loading);
        messages.scrollTop = messages.scrollHeight;
        
        try {
          const res = await fetch('/api/agent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ message: text, mode: builderMode ? 'builder' : 'mentor' })
          });
          const data = await res.json();
          
          document.getElementById(loadingId).remove();
          
          if (data.error) {
            addChatMessage('ai', 'Error: ' + data.error + '. Make sure you are logged in.');
          } else {
            addChatMessage('ai', data.response);
          }
        } catch (e) {
          document.getElementById(loadingId).remove();
          addChatMessage('ai', 'Sorry, I encountered an error. Please try again.');
        }
      }
    }

    // Run code
    function runCode() {
      if (!editor) return;
      const code = editor.getValue();
      addTerminalOutput('Running code...');
      try {
        // Safe eval - only log output
        const logs = [];
        const mockConsole = { log: (...args) => logs.push(args.join(' ')) };
        const fn = new Function('console', code);
        fn(mockConsole);
        logs.forEach(log => addTerminalOutput(log));
      } catch (e) {
        addTerminalOutput('Error: ' + e.message);
      }
    }

    // Check auth on load
    checkAuth();
    
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('[PWA] Athelgard service worker registered'))
        .catch(err => console.log('[PWA] SW registration failed:', err));
    }
    
    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.createElement('button');
    installBtn.id = 'pwa-install-btn';
    installBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:999;padding:12px 20px;background:#38bdf8;color:#0a0e1a;border:none;border-radius:8px;font-weight:600;cursor:pointer;display:none;box-shadow:0 4px 12px rgba(56,189,248,0.3);';
    installBtn.innerHTML = '🦉 Install Athelgard';
    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
        console.log('[PWA] Athelgard installed');
      }
      deferredPrompt = null;
    };
    document.body.appendChild(installBtn);
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
      console.log('[PWA] Install prompt ready');
    });
    
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
      console.log('[PWA] Athelgard installed!');
    });
  </script>
</body>
</html>
