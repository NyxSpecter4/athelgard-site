<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Athelgard — Coding Agent</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#111620;--line:#253044;--text:#e8eef8;--muted:#9badc4;--cyan:#49d8ff;--red:#ff8a9b;--green:#5de8aa}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px system-ui,sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}.shell{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,52px);box-shadow:0 30px 90px #0008}h1{margin:0 0 10px;font-size:clamp(2rem,6vw,3.8rem)}p{line-height:1.6;color:var(--muted);max-width:62ch}.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:.86rem;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.connected .dot{background:var(--green)}.error .dot{background:var(--red)}button{margin-top:24px;border:0;border-radius:10px;background:var(--cyan);color:#041017;font-weight:750;font-size:1rem;padding:13px 18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.detail{margin-top:18px;font-size:.9rem;min-height:1.5em}.hidden{display:none}</style>
</head>
<body>
  <main class="shell">
    <div id="status" class="badge"><span class="dot"></span><span id="statusText">Checking GitHub connection…</span></div>
    <h1>🦉 Athelgard</h1>
    <p>Your coding agent works from repositories you explicitly connect. GitHub access is held in a secure server-side session, not pasted into this page.</p>
    <button id="connect" type="button" class="hidden">Connect GitHub</button>
    <p id="detail" class="detail" role="status"></p>
  </main>
  <script>
    const statusEl=document.getElementById('status');const statusText=document.getElementById('statusText');const button=document.getElementById('connect');const detail=document.getElementById('detail');
    function setStatus(kind,text){statusEl.className='badge '+kind;statusText.textContent=text}
    async function checkConnection(){
      const params=new URLSearchParams(location.search);
      if(params.get('github_error')) detail.textContent='GitHub connection did not finish: '+params.get('github_error');
      try{
        const response=await fetch('/api/github?action=status',{credentials:'same-origin'});
        const data=await response.json();
        if(response.ok&&data.connected){setStatus('connected','GitHub connected as '+data.user.login);detail.textContent='Athelgard can now read the repositories you grant it access to.';return;}
        setStatus('', 'GitHub not connected');button.classList.remove('hidden');
      }catch(error){setStatus('error','GitHub service unavailable');detail.textContent='The connection endpoint did not respond. Check the current deployment configuration.';button.classList.remove('hidden');}
    }
    button.addEventListener('click',()=>{button.disabled=true;button.textContent='Opening GitHub…';location.assign('/api/github?action=start')});
    checkConnection();
  </script>
</body>
</html>
