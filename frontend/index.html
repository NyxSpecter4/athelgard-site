<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Athelgard</title>
<script src="/modules/brain.js"></script><script src="/modules/config.js"></script>
<style>:root{--bg:#0a0a0f;--bg2:#12121a;--cyan:#12e0ff;--text:#e0e0e0;--border:#1a1a2e}
body{background:var(--bg);color:var(--text);font-family:system-ui;height:100vh;margin:0;display:flex;flex-direction:column}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:24px;font-weight:800;color:var(--cyan)}
.status{margin-left:auto;font-size:11px}
.status span{padding:4px 10px;border-radius:20px;background:rgba(61,255,154,0.15);color:#3dff9a;border:1px solid #3dff9a}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--cyan);color:#000}
.msg.ai{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
.input-area{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:14px;outline:none}
button{background:var(--cyan);border:none;border-radius:12px;padding:12px 20px;color:#000;font-weight:700;cursor:pointer}
</style></head><body>
<header class="header"><div class="logo">🦉 Athelgard</div><div class="status"><span>Brain: Active</span><span>GitHub: <span id="gh">Checking...</span></span></div></header>
<main style="flex:1;max-width:900px;width:100%;margin:0 auto"><div class="messages" id="msg"></div></main>
<div class="input-area"><input type="text" id="inp" placeholder="Ask..." onkeydown="if(event.key==='Enter') send()" disabled>
<button onclick="send()" disabled>Send</button></div>
<script>
const m=document.getElementById('msg');const i=document.getElementById('inp');const g=document.getElementById('gh');
function a(s,t,u){const d=document.createElement('div');d.className='msg '+ (u?'user':'ai');if(!u){const n=document.createElement('div');n.className='name';n.textContent=s;d.appendChild(n)}d.innerHTML+=t;m.appendChild(d);m.scrollTop=m.scrollHeight}
function c(){fetch('/api/github?action=status').then(r=>r.json()).then(d=>{g.textContent=d.connected?'Connected ✓':'Not Connected';if(d.connected){i.disabled=false;document.querySelector('button').disabled=false;a('Athelgard','GitHub connected! Start coding.')}}).catch(()=>{g.textContent='Error'})}
function send(){const t=i.value.trim();if(!t)return;i.value='';a('You',t,true);fetch('/api/brain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:t})}).then(r=>r.json()).then(d=>a('Athelgard',d.response||d.mentor||'I heard you!')).catch(()=>a('Athelgard','Error. Try again.'))}
a('Athelgard','🦉 Athelgard v3.0 - Merge Master Complete');a('Athelgard','Connect GitHub to start coding.');c();setInterval(c,30000);
</script></body></html>
