<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="background-color" content="#0a0e1a">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/owl.svg">
  <link rel="icon" type="image/svg+xml" href="/icons/owl.svg">
  
  <title>Athelgard</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0d1117;
      --bg-light: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --success: #3fb950;
    }
    
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    /* Mobile-optimized layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .header {
      height: 48px;
      background: var(--bg-light);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .header img {
      width: 28px;
      height: 28px;
    }
    
    .header h1 {
      font-size: 1rem;
      color: var(--accent);
    }
    
    .content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    
    /* Chat panel (primary on mobile) */
    .chat-container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .message {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.5;
      max-width: 85%;
    }
    
    .message.user {
      background: var(--accent);
      color: var(--bg);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    
    .message.ai {
      background: var(--bg-light);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    
    .message .sender {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
      font-weight: 600;
    }
    
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    
    .chat-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      outline: none;
      -webkit-appearance: none;
    }
    
    .chat-input:focus {
      border-color: var(--accent);
    }
    
    /* Bottom nav for mobile */
    .bottom-nav {
      height: 56px;
      background: var(--bg-light);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
    }
    
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      cursor: pointer;
      font-family: inherit;
    }
    
    .nav-btn.active {
      color: var(--accent);
    }
    
    .nav-btn .icon {
      font-size: 1.25rem;
    }
    
    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Battery indicator */
    .battery-indicator {
      position: fixed;
      top: 52px;
      right: 12px;
      background: var(--bg-light);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: none;
      z-index: 100;
    }
    
    .battery-indicator.visible {
      display: block;
    }
    
    .battery-indicator.low {
      color: #ff7b72;
      border-color: #ff7b72;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <img src="/icons/owl.svg" alt="Athelgard">
      <h1>Athelgard</h1>
    </header>
    
    <div class="content">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="message ai">
            <div class="sender">Athelgard</div>
            Wings spread. What are we hunting today?
          </div>
        </div>
        
        <div class="chat-input-area">
          <input 
            type="text" 
            class="chat-input" 
            id="chatInput" 
            placeholder="Ask anything..."
            autocomplete="off"
          >
        </div>
      </div>
    </div>
    
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="chat">
        <span class="icon">💬</span>
        <span>Chat</span>
      </button>
      <button class="nav-btn" data-tab="code">
        <span class="icon">💻</span>
        <span>Code</span>
      </button>
      <button class="nav-btn" data-tab="missions">
        <span class="icon">🎯</span>
        <span>Hunt</span>
      </button>
      <button class="nav-btn" data-tab="profile">
        <span class="icon">👤</span>
        <span>Me</span>
      </button>
    </nav>
  </div>
  
  <div class="battery-indicator" id="batteryIndicator">
    🔋 <span id="batteryLevel">--</span>%
  </div>
  
  <!-- Lazy-loaded modules -->
  <script src="/modules/asset-loader.js"></script>
  <script>
    // Mobile-optimized Athelgard
    class AthelgardMobile {
      constructor() {
        this.messages = document.getElementById('chatMessages');
        this.input = document.getElementById('chatInput');
        this.batteryIndicator = document.getElementById('batteryIndicator');
        this.batteryLevel = document.getElementById('batteryLevel');
        
        this.setupEventListeners();
        this.setupBatteryMonitoring();
        this.setupTouchGestures();
      }
      
      setupEventListeners() {
        // Send on Enter
        this.input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            this.sendMessage();
          }
        });
        
        // Tab switching
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const tab = btn.dataset.tab;
            if (tab === 'code') {
              this.loadCodeEditor();
            }
          });
        });
      }
      
      setupBatteryMonitoring() {
        if ('getBattery' in navigator) {
          navigator.getBattery().then(battery => {
            this.updateBatteryUI(battery);
            
            battery.addEventListener('levelchange', () => {
              this.updateBatteryUI(battery);
            });
            
            battery.addEventListener('chargingchange', () => {
              this.updateBatteryUI(battery);
            });
          });
        }
      }
      
      updateBatteryUI(battery) {
        const level = Math.round(battery.level * 100);
        this.batteryLevel.textContent = level;
        this.batteryIndicator.classList.add('visible');
        
        if (level < 20) {
          this.batteryIndicator.classList.add('low');
        } else {
          this.batteryIndicator.classList.remove('low');
        }
        
        // Reduce effects when battery is low
        if (level < 15 && !battery.charging) {
          document.body.classList.add('power-save');
        } else {
          document.body.classList.remove('power-save');
        }
      }
      
      setupTouchGestures() {
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          this.handleSwipe(touchStartX, touchEndX);
        });
      }
      
      handleSwipe(startX, endX) {
        const diff = startX - endX;
        const threshold = 100;
        
        if (Math.abs(diff) > threshold) {
          const tabs = ['chat', 'code', 'missions', 'profile'];
          const activeTab = document.querySelector('.nav-btn.active');
          const currentIndex = tabs.indexOf(activeTab.dataset.tab);
          
          if (diff > 0 && currentIndex < tabs.length - 1) {
            // Swipe left → next tab
            this.switchTab(tabs[currentIndex + 1]);
          } else if (diff < 0 && currentIndex > 0) {
            // Swipe right → prev tab
            this.switchTab(tabs[currentIndex - 1]);
          }
        }
      }
      
      switchTab(tabName) {
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tabName);
        });
      }
      
      async sendMessage() {
        const text = this.input.value.trim();
        if (!text) return;
        
        // Add user message
        this.addMessage('user', text);
        this.input.value = '';
        
        // Show loading
        const loadingId = 'loading-' + Date.now();
        this.addLoading(loadingId);
        
        try {
          const response = await fetch('/api/agent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          
          const data = await response.json();
          document.getElementById(loadingId)?.remove();
          
          if (data.error) {
            this.addMessage('ai', 'Error: ' + data.error);
          } else {
            this.addMessage('ai', data.response);
          }
        } catch (err) {
          document.getElementById(loadingId)?.remove();
          this.addMessage('ai', 'Connection error. Working offline?');
        }
      }
      
      addMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = `message ${role}`;
        msg.innerHTML = `
          <div class="sender">${role === 'ai' ? 'Athelgard' : 'You'}</div>
          ${text}
        `;
        this.messages.appendChild(msg);
        this.messages.scrollTop = this.messages.scrollHeight;
      }
      
      addLoading(id) {
        const loading = document.createElement('div');
        loading.id = id;
        loading.className = 'message ai';
        loading.innerHTML = '<div class="loading"><div class="spinner"></div>Thinking...</div>';
        this.messages.appendChild(loading);
        this.messages.scrollTop = this.messages.scrollHeight;
      }
      
      async loadCodeEditor() {
        // Lazy-load code editor only when needed
        if (!window.codeEditorLoaded) {
          await assetLoader.load('/modules/monaco-loader.js');
          window.codeEditorLoaded = true;
        }
      }
    }
    
    // Initialize
    window.athelgard = new AthelgardMobile();
    
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('[PWA] Service worker registered'))
        .catch(err => console.log('[PWA] SW failed:', err));
    }
  </script>
</body>
</html>
