<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athelgard — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    .owl { font-size: 4rem; margin-bottom: 1rem; }
    .tagline { color: #8892b0; margin-bottom: 2rem; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem;
      margin: 1rem 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: white;
    }
    .btn-primary {
      background: #238636;
    }
    .btn-primary:hover {
      background: #2ea043;
    }
    .btn-secondary {
      background: #1f6feb;
      margin-top: 1rem;
    }
    .btn-secondary:hover {
      background: #388bfd;
    }
    .code-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'SF Mono', monospace;
      font-size: 1.5rem;
      color: #3fb950;
      margin: 1rem 0;
      letter-spacing: 0.1em;
    }
    .hidden { display: none; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .user-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    .steps {
      text-align: left;
      margin: 1rem 0;
    }
    .steps li {
      margin: 0.5rem 0;
      color: #8892b0;
    }
    .terminal {
      background: #0d1117;
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      font-family: 'SF Mono', monospace;
      font-size: 0.875rem;
      color: #e6edf3;
      margin-top: 1rem;
    }
    .terminal .prompt { color: #3fb950; }
    .terminal .command { color: #e6edf3; }
  </style>
</head>
<body>
  <div class="container">
    <div class="owl">🦉</div>
    <h1>Athelgard</h1>
    <p class="tagline">Your AI coding companion</p>

    <!-- Not logged in -->
    <div id="login-section" class="card">
      <h2>Connect with GitHub</h2>
      <p style="margin: 1rem 0; color: #8892b0;">
        Login to access your repositories and start coding with AI.
      </p>
      <a href="/api/health?path=github&action=login" class="btn btn-primary">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Login with GitHub
      </a>
    </div>

    <!-- Logged in -->
    <div id="user-section" class="card hidden">
      <div class="user-info">
        <img id="user-avatar" src="" alt="">
        <div>
          <div id="user-name" style="font-weight: 600;"></div>
          <div style="color: #3fb950; font-size: 0.875rem;">● Connected</div>
        </div>
      </div>

      <h3>Connect Your CLI</h3>
      <p style="margin: 0.5rem 0; color: #8892b0; font-size: 0.875rem;">
        Generate a code to link your terminal:
      </p>
      
      <button id="generate-code" class="btn btn-secondary">
        Generate CLI Code
      </button>
      
      <div id="code-section" class="hidden">
        <div class="code-box" id="pair-code">----</div>
        <p style="color: #8892b0; font-size: 0.875rem;">Expires in 5 minutes</p>
        
        <div class="terminal">
          <span class="prompt">$</span> <span class="command">athelgard connect <span id="code-in-terminal">ABCD-1234</span></span>
        </div>
      </div>

      <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
        <a href="/" class="btn" style="background: #21262d; color: #c9d1d9;">Enter Athelgard →</a>
      </div>
    </div>
  </div>

  <script>
    async function checkAuth() {
      try {
        const res = await fetch('/api/health?path=github&action=status');
        const data = await res.json();
        
        if (data.connected) {
          document.getElementById('login-section').classList.add('hidden');
          document.getElementById('user-section').classList.remove('hidden');
          document.getElementById('user-name').textContent = data.user.login;
          document.getElementById('user-avatar').src = data.user.avatar_url;
        }
      } catch (e) {
        console.error('Auth check failed:', e);
      }
    }

    document.getElementById('generate-code').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/health?path=github&action=cli-code');
        const data = await res.json();
        
        if (data.code) {
          document.getElementById('code-section').classList.remove('hidden');
          document.getElementById('pair-code').textContent = data.code;
          document.getElementById('code-in-terminal').textContent = data.code;
        }
      } catch (e) {
        alert('Failed to generate code. Make sure you are logged in.');
      }
    });

    // Check auth on load
    checkAuth();
  </script>
</body>
</html>
