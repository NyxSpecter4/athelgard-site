<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athelgard — AI Coding Agent</title>
<link rel="manifest" href="/manifest.json">
<script src="/modules/brain.js"></script>
<script src="/modules/config.js"></script>
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--cyan:#12e0ff;--text:#e0e0e0;--border:#1a1a2e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:24px;font-weight:800;color:var(--cyan)}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--cyan);color:#000}
.msg.ai{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
.input-area{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:14px;outline:none}
button{background:var(--cyan);border:none;border-radius:12px;padding:12px 20px;color:#000;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header class="header"><div class="logo">🦉 Athelgard</div></header>
<main class="main"><div class="messages" id="messages"></div></main>
<div class="input-area">
  <input type="text" id="userInput" placeholder="Ask Athelgard..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Send</button>
</div>
<script>
const messages = document.getElementById('messages');
const userInput = document.getElementById('userInput');
function addMessage(sender, text, isUser=false) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + (isUser ? 'user' : 'ai');
  msg.innerHTML = (isUser ? '' : '<div class="name">' + sender + '</div>') + text;
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
}
function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  addMessage('You', text, true);
  setTimeout(() => addMessage('Athelgard', 'I heard you! The merge is complete. All systems operational.'), 500);
}
addMessage('Athelgard', '🦉 Athelgard Agent v2.0 - Team synthesis complete. MELI, Mako, Captain, and all contributors unified.');
</script>
</body>
</html>
