<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>Athelgard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: #111827;
      --bg3: #1a2236;
      --border: #1e3a5f;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --cyan: #38bdf8;
      --purple: #c084fc;
      --gold: #fbbf24;
      --green: #34d399;
      --red: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ===== LAYOUT ===== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      height: 48px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 10;
    }
    .logo {
      font-weight: 700;
      font-size: 16px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon { font-size: 22px; -webkit-text-fill-color: initial; }
    .topbar-spacer { flex: 1; }
    .topbar-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
    }
    .topbar-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .topbar-btn.active { background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #fff; border: none; }

    /* ===== MAIN CONTENT ===== */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ===== CHAT PANEL (PRIMARY) ===== */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      padding: 0 16px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 85%;
      animation: msgIn 0.3s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-user {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg-assistant {
      background: var(--bg3);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    .msg-game {
      background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(192,132,252,0.1));
      border: 1px solid var(--gold);
      align-self: center;
      max-width: 95%;
      width: 100%;
    }

    /* ===== VOICE INPUT AREA ===== */
    .voice-area {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .voice-hint {
      font-size: 12px;
      color: var(--text2);
    }
    .voice-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .voice-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      transform: scale(1.05);
    }
    .voice-btn.recording {
      background: linear-gradient(135deg, var(--red), var(--purple));
      color: #fff;
      border-color: var(--red);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(248,113,113,0); }
    }
    .text-input-wrap {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }
    .text-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .text-input:focus { border-color: var(--cyan); }
    .send-btn {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none;
      border-radius: 12px;
      width: 44px;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    /* ===== SIDE PANEL (CODE/GAMES) ===== */
    .side-panel {
      width: 0;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      overflow: hidden;
      transition: width 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .side-panel.open { width: 500px; }
    .side-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .side-close {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 20px;
      cursor: pointer;
    }
    .side-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* ===== CODE EDITOR (HIDDEN BY DEFAULT) ===== */
    .editor {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    /* ===== GAME STYLES ===== */
    .game-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      color: var(--gold);
    }

    /* Jeopardy */
    .jeopardy-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .jeopardy-cat {
      text-align: center;
      padding: 8px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .jeopardy-cell {
      padding: 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      color: var(--gold);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .jeopardy-cell:hover { background: var(--border); transform: scale(1.02); }
    .jeopardy-cell.used { opacity: 0.3; pointer-events: none; }

    /* Wheel of Fortune */
    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .wheel {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: conic-gradient(
        var(--red) 0deg 60deg,
        var(--gold) 60deg 120deg,
        var(--green) 120deg 180deg,
        var(--cyan) 180deg 240deg,
        var(--purple) 240deg 300deg,
        var(--red) 300deg 360deg
      );
      position: relative;
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      border: 4px solid var(--gold);
    }
    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: var(--bg);
      border-radius: 50%;
      border: 3px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--gold);
    }
    .wheel-labels {
      position: absolute;
      inset: 0;
    }
    .wheel-label {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .spin-btn {
      padding: 14px 40px;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .spin-btn:hover { transform: scale(1.05); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .puzzle-display {
      font-size: 32px;
      letter-spacing: 8px;
      font-weight: 700;
      text-align: center;
      padding: 16px;
      background: var(--bg3);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* ===== CONNECTIONS STATUS ===== */
    .status-bar {
      padding: 6px 16px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--text2);
    }
    .status-item { display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-dot.ok { background: var(--green); }
    .status-dot.warn { background: var(--gold); }
    .status-dot.off { background: var(--text3); }

    /* ===== CONNECT MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 360px;
      max-width: 95vw;
    }
    .modal h3 { font-size: 16px; margin-bottom: 16px; }
    .modal label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
    .modal input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    .modal input:focus { border-color: var(--cyan); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .modal-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .modal-btn.primary {
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none;
      color: #fff;
    }
    .connect-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .connect-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .connect-btn .cdot { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); flex-shrink: 0; }
    .connect-btn .cdot.ok { background: var(--green); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 13px;
      z-index: 500;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .side-panel.open { width: 100%; position: fixed; inset: 48px 0 0 0; z-index: 100; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo"><span class="logo-icon">🦉</span> Athelgard</div>
    <div class="topbar-spacer"></div>
    <button class="topbar-btn" id="btn-code" onclick="togglePanel('code')">💻 Code</button>
    <button class="topbar-btn" id="btn-jeopardy" onclick="togglePanel('jeopardy')">🎯 Jeopardy</button>
    <button class="topbar-btn" id="btn-wheel" onclick="togglePanel('wheel')">🎡 Wheel</button>
    <button class="connect-btn" id="btn-gh-connect" onclick="openConnectModal('github')">
      <span class="cdot" id="cdot-github"></span> GitHub
    </button>
    <button class="connect-btn" id="btn-vc-connect" onclick="openConnectModal('vercel')">
      <span class="cdot" id="cdot-vercel"></span> Vercel
    </button>
    <button class="connect-btn" id="btn-sb-connect" onclick="openConnectModal('supabase')">
      <span class="cdot" id="cdot-supabase"></span> Supabase
    </button>
    <button class="topbar-btn" onclick="showSettings()">⚙️</button>
  </div>

  <!-- Connect Modal -->
  <div class="modal-overlay" id="connect-modal-overlay" onclick="closeConnectModal(event)">
    <div class="modal" id="connect-modal">
      <h3 id="connect-modal-title">Connect</h3>
      <div id="connect-modal-body"></div>
      <div class="modal-actions">
        <button class="modal-btn" onclick="closeConnectModal()">Cancel</button>
        <button class="modal-btn primary" id="connect-modal-submit" onclick="submitConnect()">Connect</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <!-- Chat Panel (Primary) -->
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="msg msg-assistant">
          🦉 Hey Captain! I'm Athelgard — your AI coding partner. Press and hold the mic button to talk, or type below!
        </div>
      </div>
      <div class="voice-area">
        <div class="voice-hint" id="voice-hint">Hold to speak, release to send</div>
        <button class="voice-btn" id="voice-btn" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()">🎤</button>
        <div class="text-input-wrap">
          <input class="text-input" id="chat-input" placeholder="Or type here..." onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- Side Panel (Code/Games) -->
    <div class="side-panel" id="side-panel">
      <div class="side-header">
        <span id="side-title">Code</span>
        <button class="side-close" onclick="closePanel()">✕</button>
      </div>
      <div class="side-body" id="side-body">
        <!-- Dynamic content -->
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item"><span class="status-dot" id="status-deepseek"></span> DeepSeek</div>
    <div class="status-item"><span class="status-dot" id="status-kimi"></span> Kimi</div>
    <div class="status-item"><span class="status-dot" id="status-github"></span> GitHub</div>
    <div class="status-item" style="margin-left:auto;" id="peak-status">Checking...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const config = {
  apiKey: localStorage.getItem('athelgard_api_key') || '',
  kimiKey: localStorage.getItem('athelgard_kimi_key') || '',
};
// GitHub token is NO LONGER stored in localStorage — it lives in an httpOnly cookie.
// Remove any old leaked value if it exists.
localStorage.removeItem('athelgard_github_key');

let isPeak = false;
let isRecording = false;
let recognition = null;
let messageHistory = [];
let currentPanel = null;

// Integration connection state — populated by checkIntegrationStatus()
let integrationStatus = { github: false, vercel: false, supabase: false };
let integrationUser = { github: null, vercel: null, supabase: null };

// ===== PEAK HOURS =====
function checkPeak() {
  const now = new Date();
  const pst = new Date(now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
  isPeak = pst.getHours() >= 9 && pst.getHours() < 21;
  document.getElementById('peak-status').textContent = isPeak ? '⚠️ Peak Hours (using Kimi)' : '✓ Off-Peak (DeepSeek)';
}
checkPeak();
setInterval(checkPeak, 60000);

// ===== STATUS INDICATORS =====
// ===== ROBUST CONNECTION TESTING =====
let connectionStatus = { deepseek: false, kimi: false, github: false };

async function testConnections() {
  const dsDot = document.getElementById('status-deepseek');
  const kimiDot = document.getElementById('status-kimi');
  
  // Test DeepSeek
  if (config.apiKey) {
    try {
      const res = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `****** },
        body: JSON.stringify({ model: 'deepseek-chat', messages: [{role:'user',content:'hi'}], max_tokens: 5 })
      });
      connectionStatus.deepseek = res.ok;
      dsDot.className = 'status-dot ' + (res.ok ? 'ok' : 'warn');
      if (!res.ok) console.error('DeepSeek test failed:', res.status);
    } catch (e) {
      connectionStatus.deepseek = false;
      dsDot.className = 'status-dot warn';
      console.error('DeepSeek test error:', e);
    }
  } else {
    dsDot.className = 'status-dot off';
  }
  
  // Test Kimi
  if (config.kimiKey) {
    try {
      const res = await fetch('https://api.moonshot.cn/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `****** },
        body: JSON.stringify({ model: 'kimi-k2p6', messages: [{role:'user',content:'hi'}], max_tokens: 5 })
      });
      connectionStatus.kimi = res.ok;
      kimiDot.className = 'status-dot ' + (res.ok ? 'ok' : 'warn');
      if (!res.ok) console.error('Kimi test failed:', res.status);
    } catch (e) {
      connectionStatus.kimi = false;
      kimiDot.className = 'status-dot warn';
      console.error('Kimi test error:', e);
    }
  } else {
    kimiDot.className = 'status-dot off';
  }

  // GitHub / Vercel / Supabase status is managed by checkIntegrationStatus()
  const ghDot = document.getElementById('status-github');
  if (ghDot) ghDot.className = 'status-dot ' + (integrationStatus.github ? 'ok' : 'off');
}

// ===== INTEGRATION STATUS (server-side httpOnly cookies) =====
async function checkIntegrationStatus() {
  try {
    const res = await fetch('/api/auth/status');
    if (!res.ok) return;
    const data = await res.json();
    integrationStatus.github = !!data.github?.connected;
    integrationStatus.vercel = !!data.vercel?.connected;
    integrationStatus.supabase = !!data.supabase?.connected;
    integrationUser.github = data.github?.user || null;
    integrationUser.vercel = data.vercel?.user || null;
    integrationUser.supabase = data.supabase?.url || null;
  } catch (e) {
    console.warn('[Athelgard] Could not reach /api/auth/status (running locally?)', e.message);
  }
  updateConnectDots();
}

function updateConnectDots() {
  const services = ['github', 'vercel', 'supabase'];
  for (const svc of services) {
    const dot = document.getElementById(`cdot-${svc}`);
    if (dot) dot.className = 'cdot' + (integrationStatus[svc] ? ' ok' : '');
  }
  const ghDot = document.getElementById('status-github');
  if (ghDot) ghDot.className = 'status-dot ' + (integrationStatus.github ? 'ok' : 'off');
}

// ===== CONNECT MODAL =====
let connectingService = null;

// Cache of public client IDs fetched from /api/meta/config
let _publicConfig = null;
async function getPublicConfig() {
  if (_publicConfig) return _publicConfig;
  try {
    const res = await fetch('/api/meta/config');
    _publicConfig = res.ok ? await res.json() : {};
  } catch (_) { _publicConfig = {}; }
  return _publicConfig;
}

const CONNECT_CONFIG = {
  github: {
    title: '🐙 Connect GitHub',
    async oauthUrl() {
      const cfg = await getPublicConfig();
      const clientId = cfg.githubClientId || '';
      if (!clientId) {
        showToast('⚠️ GITHUB_CLIENT_ID not configured. Set it in Vercel env vars.');
        return null;
      }
      return `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(clientId)}&scope=repo,user&redirect_uri=${encodeURIComponent(location.origin + '/api/github/callback')}`;
    },
    bodyHtml: `<p style="font-size:13px;color:var(--text2);margin-bottom:16px;">Click <strong>Authorize</strong> to sign in with GitHub. You will be redirected to GitHub and back automatically. No token is stored in your browser.</p>`,
    submitLabel: 'Authorize with GitHub',
    submitAction: 'oauth',
  },
  vercel: {
    title: '▲ Connect Vercel',
    async oauthUrl() {
      const cfg = await getPublicConfig();
      const clientId = cfg.vercelClientId || '';
      if (!clientId) {
        showToast('⚠️ VERCEL_CLIENT_ID not configured. Set it in Vercel env vars.');
        return null;
      }
      return `https://vercel.com/integrations/${encodeURIComponent(clientId)}/new?redirect_uri=${encodeURIComponent(location.origin + '/api/vercel/callback')}`;
    },
    bodyHtml: `<p style="font-size:13px;color:var(--text2);margin-bottom:16px;">Click <strong>Authorize</strong> to connect your Vercel account. You will be redirected to Vercel and back. No token is stored in your browser.</p>`,
    submitLabel: 'Authorize with Vercel',
    submitAction: 'oauth',
  },
  supabase: {
    title: '⚡ Connect Supabase',
    bodyHtml: `
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px;">Enter your Supabase project URL and service-role (or anon) key. These are stored securely server-side — never in your browser.</p>
      <label>Project URL</label>
      <input type="url" id="sb-url" placeholder="https://xxxx.supabase.co" autocomplete="off">
      <label>Service-role Key</label>
      <input type="password" id="sb-key" placeholder="eyJ..." autocomplete="off">`,
    submitLabel: 'Connect',
    submitAction: 'post',
  },
};

function openConnectModal(service) {
  connectingService = service;
  const cfg = CONNECT_CONFIG[service];
  if (!cfg) return;
  document.getElementById('connect-modal-title').textContent = cfg.title;
  document.getElementById('connect-modal-body').innerHTML = cfg.bodyHtml;
  document.getElementById('connect-modal-submit').textContent = cfg.submitLabel;
  document.getElementById('connect-modal-overlay').classList.add('open');
}

function closeConnectModal(e) {
  if (e && e.target !== document.getElementById('connect-modal-overlay')) return;
  document.getElementById('connect-modal-overlay').classList.remove('open');
  connectingService = null;
}

async function submitConnect() {
  const service = connectingService;
  const cfg = CONNECT_CONFIG[service];
  if (!cfg) return;

  if (cfg.submitAction === 'oauth') {
    const url = await cfg.oauthUrl();
    if (url) location.href = url;
    return;
  }

  if (service === 'supabase') {
    const url = document.getElementById('sb-url')?.value?.trim();
    const key = document.getElementById('sb-key')?.value?.trim();
    if (!url || !key) { showToast('⚠️ Both URL and key are required.'); return; }

    const btn = document.getElementById('connect-modal-submit');
    btn.textContent = 'Connecting...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/supabase/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, key }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Connection failed');

      integrationStatus.supabase = true;
      integrationUser.supabase = data.url;
      updateConnectDots();
      document.getElementById('connect-modal-overlay').classList.remove('open');
      connectingService = null;
      showToast('✅ Supabase connected!');
    } catch (err) {
      showToast('❌ ' + err.message);
    } finally {
      btn.textContent = cfg.submitLabel;
      btn.disabled = false;
    }
  }
}

// ===== VOICE =====
function startVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('Voice not supported. Use Chrome.');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  
  isRecording = true;
  document.getElementById('voice-btn').classList.add('recording');
  document.getElementById('voice-hint').textContent = 'Listening...';
  
  recognition.onresult = (e) => {
    const text = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('chat-input').value = text;
  };
  
  recognition.onend = () => {
    if (isRecording) {
      const text = document.getElementById('chat-input').value.trim();
      if (text) sendMessage();
    }
    stopVoice();
  };
  
  recognition.start();
}

function stopVoice() {
  isRecording = false;
  if (recognition) recognition.stop();
  document.getElementById('voice-btn').classList.remove('recording');
  document.getElementById('voice-hint').textContent = 'Hold to speak, release to send';
}

// ===== CHAT =====
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  addMsg('user', text);
  input.value = '';

  // Check if it's a game command
  if (text.toLowerCase().includes('jeopardy')) { showJeopardy(); return; }
  if (text.toLowerCase().includes('wheel')) { showWheel(); return; }

  // Check if it's a bounty/security query (MELI's brain)
  if (isBountyQuery(text)) {
    const bountyReply = await handleBountyQuery(text);
    addMsg('assistant', bountyReply);
    return;
  }

  // Try sending immediately - don't wait for connection tests
  try {
    let reply, usedModel;
    
    // Try DeepSeek first (cheaper)
    if (config.apiKey) {
      try {
        reply = await getAIResponse(text, 'deepseek');
        usedModel = 'DeepSeek';
      } catch (e) {
        console.log('DeepSeek failed:', e.message);
        // Try Kimi fallback
        if (config.kimiKey) {
          addMsg('assistant', '🔄 Trying Kimi fallback...');
          reply = await getAIResponse(text, 'kimi');
          usedModel = 'Kimi';
        } else {
          throw e;
        }
      }
    } else if (config.kimiKey) {
      reply = await getAIResponse(text, 'kimi');
      usedModel = 'Kimi';
    } else {
      addMsg('assistant', '❌ No API key configured. Click ⚙️ Settings to add your DeepSeek or Kimi key.');
      return;
    }
    
    addMsg('assistant', reply);
  } catch (e) {
    console.error('Chat error:', e);
    addMsg('assistant', '❌ Error: ' + e.message + '\n\nYour API key might be invalid or expired.\n\nCheck:\n1. Key is correct in ⚙️ Settings\n2. You have credits at the provider\n3. Try regenerating the key');
  }
}

async function getAIResponse(text, model) {
  console.log(`[Athelgard] Sending request to ${model}...`);
  const url = model === 'kimi' ? 'https://api.moonshot.cn/v1/chat/completions' : 'https://api.deepseek.com/chat/completions';
  const key = model === 'kimi' ? config.kimiKey : config.apiKey;
  const modelName = model === 'kimi' ? 'kimi-k2p6' : 'deepseek-chat';

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: modelName,
        messages: [
          { role: 'system', content: (() => {
            const ghStatus = integrationStatus.github ? `GitHub connected as ${integrationUser.github || 'user'}` : 'GitHub not connected';
            const vcStatus = integrationStatus.vercel ? `Vercel connected as ${integrationUser.vercel || 'user'}` : 'Vercel not connected';
            const sbStatus = integrationStatus.supabase ? `Supabase connected (${integrationUser.supabase || 'project'})` : 'Supabase not connected';
            return `You are Athelgard, a friendly AI coding partner. Help with code, explain concepts, and be encouraging. Keep responses concise and actionable. Current integration status: ${ghStatus}. ${vcStatus}. ${sbStatus}. Only refer to a service as connected if its status above says connected.`;
          })() },
          ...messageHistory.slice(-4),
          { role: 'user', content: text }
        ],
        temperature: 0.7,
        max_tokens: 2000
      })
    });

    console.log(`[Athelgard] ${model} response status:`, res.status);

    if (!res.ok) {
      const errText = await res.text();
      console.error(`[Athelgard] ${model} error:`, errText);
      throw new Error(`${model} API error: HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content;
    
    if (!reply) {
      console.error('[Athelgard] Empty response:', data);
      throw new Error('Empty response from AI');
    }
    
    console.log(`[Athelgard] ${model} success, reply length:`, reply.length);
    
    messageHistory.push({ role: 'user', content: text });
    messageHistory.push({ role: 'assistant', content: reply });
    if (messageHistory.length > 10) messageHistory = messageHistory.slice(-10);
    
    return reply;
  } catch (e) {
    console.error(`[Athelgard] ${model} request failed:`, e);
    throw e;
  }
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  div.innerHTML = formatText(text);
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function formatText(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => `<pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;overflow-x:auto;font-family:monospace;font-size:12px;margin-top:8px;">${code}</pre>`)
    .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;font-size:12px;">$1</code>')
    .replace(/\n/g, '<br>');
}

// ===== MELI'S BRAIN INTEGRATION =====
// Ethical Hunt Loop - Security gate for bounty submissions
const HUNT_DECISIONS = Object.freeze({
  BLOCKED: 'blocked',
  NEEDS_SCOPE: 'needs_scope',
  INVESTIGATE: 'investigate',
  REPORT_READY: 'report_ready',
});

function evaluateBountyAttempt(attempt = {}) {
  const scope = attempt.scope || {};
  const evidence = attempt.evidence || {};
  
  if (attempt.simulated !== true) {
    return { status: HUNT_DECISIONS.BLOCKED, reason: 'Only simulated targets allowed.' };
  }
  if (!scope.program || !scope.authorized) {
    return { status: HUNT_DECISIONS.NEEDS_SCOPE, reason: 'Scope authorization required.' };
  }
  
  const required = ['observation', 'impact', 'reproduction', 'remediation'];
  const missing = required.filter(k => !evidence[k] || evidence[k].trim().length < 10);
  if (missing.length) {
    return { status: HUNT_DECISIONS.INVESTIGATE, missing, reason: 'Incomplete evidence.' };
  }
  
  return { status: HUNT_DECISIONS.REPORT_READY, reason: 'Complete report.', score: 100 };
}

// Builder Brain - Review findings
function reviewFinding(attempt) {
  const gate = evaluateBountyAttempt(attempt);
  
  if (gate.status === HUNT_DECISIONS.BLOCKED) {
    return `🚫 BLOCKED: ${gate.reason}\n\nAthelgard only reviews SIMULATED bounty hunts for training. Real targets are blocked.`;
  }
  if (gate.status === HUNT_DECISIONS.NEEDS_SCOPE) {
    return `📋 NEEDS SCOPE: ${gate.reason}\n\nBefore investigating, define:\n- What program?\n- Is it authorized?\n- What's in scope?`;
  }
  if (gate.status === HUNT_DECISIONS.INVESTIGATE) {
    return `🔍 INCOMPLETE: Missing ${gate.missing.join(', ')}\n\nA strong finding needs:\n1. Observation - what you saw\n2. Impact - why it matters\n3. Reproduction - how to verify\n4. Remediation - how to fix`;
  }
  
  return `✅ REPORT READY! Score: ${gate.score}/100\n\nYour finding has:\n✓ Proper scope\n✓ Complete evidence\n✓ Clear impact\n✓ Reproduction steps\n✓ Remediation advice\n\nThis is a defensible responsible disclosure packet!`;
}

// Detect bounty-related messages
function isBountyQuery(text) {
  const lower = text.toLowerCase();
  return lower.includes('bounty') || lower.includes('finding') || lower.includes('vulnerability') || 
         lower.includes('security') || lower.includes('hack') || lower.includes('pentest') ||
         lower.includes('scope') || lower.includes('report');
}

// Handle bounty submissions via chat
async function handleBountyQuery(text) {
  // Extract attempt from message
  const attempt = {
    simulated: text.toLowerCase().includes('simulated') || text.toLowerCase().includes('practice'),
    scope: {
      program: text.match(/program[:\s]+([^\n]+)/i)?.[1],
      authorized: text.toLowerCase().includes('authorized') || text.toLowerCase().includes('approved'),
    },
    evidence: {
      observation: text.match(/observation[:\s]+([^\n]+)/i)?.[1],
      impact: text.match(/impact[:\s]+([^\n]+)/i)?.[1],
      reproduction: text.match(/reproduction[:\s]+([^\n]+)/i)?.[1],
      remediation: text.match(/remediation[:\s]+([^\n]+)/i)?.[1],
    }
  };
  
  return reviewFinding(attempt);
}

  const now = new Date();
  const pst = new Date(now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
  const isPeakHour = pst.getHours() >= 9 && pst.getHours() < 21;
  
  if (preferred === 'deepseek' && isPeakHour && config.kimiKey) {
    console.log('[Athelgard] Peak hours - using Kimi fallback');
    return 'kimi';
  }
  if (preferred === 'kimi' && !isPeakHour && config.apiKey) {
    console.log('[Athelgard] Off-peak - using DeepSeek (cheaper)');
    return 'deepseek';
  }
  return preferred;
}
