<!DOCTYPE html>
<html>
<head>
<title>Athelgard</title>
<script src="lib/github.js"></script>
</head>
<body>
<script>
const config = { apiKey: localStorage.getItem('athelgard_api_key') || '', kimiKey: localStorage.getItem('athelgard_kimi_key') || '', githubToken: localStorage.getItem('athelgard_github_key') || '' };
const githubClient = new GitHubClient(config.githubToken);
async function listRepos() { if (!config.githubToken) return 'No token'; try { const repos = await githubClient.listRepos(); return 'Repos: ' + repos.map(r => r.full_name).join(', '); } catch (e) { return 'Error: ' + e.message; } }
</script>
</body>
</html>
